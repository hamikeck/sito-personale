<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>michele_ — sito (UI kit)</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>html{scroll-behavior:smooth}body{min-height:100vh;display:flex;flex-direction:column}#root{flex:1;display:flex;flex-direction:column}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="home.jsx"></script>
<script type="text/babel" src="articoli.jsx"></script>
<script type="text/babel">
function App() {
  const { Header, SezioneContatti } = window.MicheleDesignSystem_402387;
  const [route, setRoute] = React.useState(() => localStorage.getItem("sito-kit-route") || "/");
  const go = (href) => {
    if (href.startsWith("/#")) {
      setRoute("/");
      setTimeout(() => { const el = document.getElementById(href.slice(2)); if (el) window.scrollTo({ top: el.offsetTop - 64, behavior: "smooth" }); }, 50);
      return;
    }
    setRoute(href); window.scrollTo(0, 0);
  };
  React.useEffect(() => { localStorage.setItem("sito-kit-route", route); }, [route]);
  let pagina;
  if (route === "/") pagina = <SitoHome go={go} />;
  else if (route === "/progetti") pagina = <SitoProgetti />;
  else if (route === "/articoli") pagina = <SitoArticoli go={go} />;
  else if (route.startsWith("/articoli/")) pagina = <SitoArticolo slug={route.split("/")[2]} go={go} />;
  else pagina = <SitoNotFound go={go} />;
  return (
    <>
      <Header onNavigate={go} attiva={route} voci={[{ nome: "Progetti", href: "/progetti" }, { nome: "Articoli", href: "/articoli" }, { nome: "Video", href: "/#video" }, { nome: "Contatti", href: "/#contatti" }]} />
      <main style={{ flex: 1 }}>{pagina}</main>
      <SezioneContatti />
      <div style={{ position: "fixed", right: 12, bottom: 12, fontFamily: "var(--font-mono)", fontSize: 11, display: "flex", gap: 6 }}>
        {["/", "/progetti", "/articoli", "/404"].map((r) => <button key={r} onClick={() => go(r)} style={{ fontFamily: "inherit", fontSize: 11, padding: "4px 8px", borderRadius: 999, border: "2px solid var(--foreground)", background: route === r ? "var(--secondary)" : "var(--card)", color: "var(--foreground)", cursor: "pointer" }}>{r}</button>)}
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
